<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">Rehearse recovery architecture</title>
  <desc id="desc">A read-only restic backup source connects to an isolated Docker Compose sandbox, application probes, and evidence reports backed by SQLite. This is an architecture illustration, not an application screenshot.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#122e4e"/>
      <stop offset="1" stop-color="#071727"/>
    </linearGradient>
    <linearGradient id="surface" x2="0" y2="1">
      <stop stop-color="#5686ad"/>
      <stop offset="1" stop-color="#416c90"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#aac7e0" stroke-opacity=".055"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L7 4L0 8" fill="none" stroke="#9ecdf1" stroke-width="2"/>
    </marker>
    <symbol id="database" viewBox="0 0 72 72">
      <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
        <ellipse cx="36" cy="16" rx="24" ry="9"/>
        <path d="M12 16v38c0 12 48 12 48 0V16M12 35c0 12 48 12 48 0"/>
      </g>
    </symbol>
  </defs>
  <rect width="1440" height="1000" fill="url(#background)"/>
  <rect width="1440" height="1000" fill="url(#grid)"/>
  <g font-family="Verdana, sans-serif">
    <text x="280" y="192" fill="#edf5fb" font-size="46" font-weight="700" letter-spacing="-1.5">Recovery architecture</text>
    <text x="282" y="235" fill="#a9c4da" font-size="23">Local control plane · Go + SQLite</text>

    <g fill="none" stroke="#9ecdf1" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M650 365H790"/>
      <path d="M980 450V525"/>
      <path d="M790 610H650"/>
    </g>

    <g>
      <rect x="280" y="280" width="370" height="170" rx="22" fill="url(#surface)" stroke="#5d86a8" stroke-opacity=".65"/>
      <use href="#database" x="310" y="318" width="72" height="72" color="#9ed3f8"/>
      <text x="410" y="352" fill="#ffffff" font-size="34" font-weight="700">restic</text>
      <text x="410" y="393" fill="#edf5fb" font-size="23">Read-only backups</text>
    </g>

    <g>
      <rect x="790" y="280" width="370" height="170" rx="22" fill="url(#surface)" stroke="#5d86a8" stroke-opacity=".65"/>
      <!-- Docker mark from Devicon, MIT. See rehearse-preview.md for provenance. -->
      <svg x="820" y="318" width="78" height="78" viewBox="0 0 128 128">
        <path fill="#7ccafa" d="M124.8 52.1c-4.3-2.5-10-2.8-14.8-1.4-.6-5.2-4-9.7-8-12.9l-1.6-1.3-1.4 1.6c-2.7 3.1-3.5 8.3-3.1 12.3.3 2.9 1.2 5.9 3 8.3-1.4.8-2.9 1.9-4.3 2.4-2.8 1-5.9 2-8.9 2H79V49H66V24H51v12H26v13H13v14H1.8l-.2 1.5c-.5 6.4.3 12.6 3 18.5l1.1 2.2.1.2c7.9 13.4 21.7 19 36.8 19 29.2 0 53.3-13.1 64.3-40.6 7.4.4 15-1.8 18.6-8.9l.9-1.8-1.6-1zM28 39h10v11H28V39zm13.1 44.2c0 1.7-1.4 3.1-3.1 3.1-1.7 0-3.1-1.4-3.1-3.1 0-1.7 1.4-3.1 3.1-3.1 1.7.1 3.1 1.4 3.1 3.1zM28 52h10v11H28V52zm-13 0h11v11H15V52zm27.7 50.2c-15.8-.1-24.3-5.4-31.3-12.4 2.1.1 4.1.2 5.9.2 1.6 0 3.2 0 4.7-.1 3.9-.2 7.3-.7 10.1-1.5 2.3 5.3 6.5 10.2 14 13.8h-3.4zM51 63H40V52h11v11zm0-13H40V39h11v11zm13 13H53V52h11v11zm0-13H53V39h11v11zm0-13H53V26h11v11zm13 26H66V52h11v11zM38.8 81.2c-.2-.1-.5-.2-.8-.2-1.2 0-2.2 1-2.2 2.2 0 1.2 1 2.2 2.2 2.2s2.2-1 2.2-2.2c0-.3-.1-.6-.2-.8-.2.3-.4.5-.8.5-.5 0-.9-.4-.9-.9.1-.4.3-.7.5-.8z"/>
      </svg>
      <text x="920" y="352" fill="#f2f7fb" font-size="34" font-weight="700">Docker</text>
      <text x="920" y="393" fill="#c2d7e8" font-size="23">Isolated sandbox</text>
    </g>

    <g>
      <rect x="790" y="525" width="370" height="170" rx="22" fill="url(#surface)" stroke="#5d86a8" stroke-opacity=".65"/>
      <g transform="translate(826 563)" fill="none" stroke="#9ed3f8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <rect width="60" height="68" rx="10"/>
        <path d="m12 20 5 5 10-11m7 6h13M12 42h35M12 54h25"/>
      </g>
      <text x="920" y="597" fill="#f2f7fb" font-size="34" font-weight="700">Probes</text>
      <text x="920" y="638" fill="#c2d7e8" font-size="23">Application checks</text>
    </g>

    <g>
      <rect x="280" y="525" width="370" height="170" rx="22" fill="url(#surface)" stroke="#5d86a8" stroke-opacity=".65"/>
      <g transform="translate(318 561)" fill="none" stroke="#9ed3f8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 0h34l18 18v56H6zM40 0v18h18M18 35h28M18 47h28M18 59h17"/>
      </g>
      <text x="410" y="597" fill="#f2f7fb" font-size="34" font-weight="700">Evidence</text>
      <text x="410" y="638" fill="#c2d7e8" font-size="23">Redacted reports</text>
    </g>
  </g>
</svg>
